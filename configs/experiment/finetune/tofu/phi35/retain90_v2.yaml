# @package _global_
# Finetune Phi-3.5-mini-instruct on the retain90 split to produce the retain
# oracle (the privacy alignment reference used by TOFU's truth-ratio /
# privleak metrics).
#
# Hyperparameters mirror full_v2.yaml exactly so the resulting two models are
# directly comparable (only the training data differs: full=4000 QA pairs,
# retain90=3600 QA pairs, excluding the 400 forget10 pairs).

defaults:
  - override /model: Phi-3.5-mini-instruct
  - override /trainer: finetune
  - override /data/datasets@data.train: TOFU_QA_retain
  - override /eval: tofu_paper

mode: finetune
model:
  model_args:
    attn_implementation: "eager"
trainer:
  args:
    learning_rate: 2e-5
    weight_decay: 0.01
    warmup_epochs: 0.3
    num_train_epochs: 15
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    lr_scheduler_type: cosine
    bf16: true
    bf16_full_eval: true
    save_strategy: 'no'
    save_only_model: true
    do_eval: false
    eval_on_start: false
    eval_strategy: 'no'

forget_split: forget10
holdout_split: holdout10
retain_logs_path: null

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

task_name: tofu_Phi-3.5-mini-instruct_retain90_v2
