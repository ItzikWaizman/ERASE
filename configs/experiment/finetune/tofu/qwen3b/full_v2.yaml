# @package _global_
# Finetune Qwen2.5-3B-Instruct on the full TOFU dataset (the "init_finetuned"
# target model for Qwen unlearning experiments).
#
# This v2 recipe fixes underfitting in the previous attempt (model_utility
# ~0.46, no memorization of forget/retain identities). Key changes vs v1:
#   * effective batch size 8  -> 32  (per_device_train_batch_size=4,
#     gradient_accumulation_steps=8). The OpenUnlearning standard for TOFU
#     finetune is an effective batch of 32 on Llama-3.2-1B-Instruct.
#   * learning_rate 1e-5 -> 2e-5. OpenUnlearning maintainer confirmed Phi
#     finetune uses 2e-5; Qwen2.5-Instruct is even more heavily aligned than
#     Llama-3.2 and needs a stronger push to overwrite generic instruct
#     priors with TOFU's fictitious identities.
#   * num_train_epochs 10 -> 15. With proper batch size + lr we still want
#     extra reps for the instruct model to memorize 4000 QA pairs.
#   * warmup_epochs 1.0 -> 0.3. Spending a full epoch (10% of training) on
#     warmup is wasteful; 3% warmup is standard.
#   * cosine LR schedule for stable end-of-training.
#   * Removed the `attn_implementation: eager` override so we use the model
#     default (flash_attention_2). Faster training and same numerics.

defaults:
  - override /model: Qwen2.5-3B-Instruct
  - override /trainer: finetune
  - override /data/datasets@data.train: TOFU_QA_full
  - override /eval: tofu_paper

mode: finetune
# flash_attn is not installed in the cluster conda env -- force eager.
# Slower than FA2 by ~2-3x but otherwise numerically equivalent. If/when
# flash_attn is installed (`pip install flash-attn --no-build-isolation`),
# this override can be removed and the model default (FA2) will kick in.
model:
  model_args:
    attn_implementation: "eager"
trainer:
  args:
    learning_rate: 2e-5
    weight_decay: 0.01
    warmup_epochs: 0.3
    num_train_epochs: 15
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    lr_scheduler_type: cosine
    bf16: true
    bf16_full_eval: true
    save_strategy: 'no'
    save_only_model: true
    do_eval: false
    eval_on_start: false
    eval_strategy: 'no'

forget_split: forget10
holdout_split: holdout10
retain_logs_path: null

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

task_name: tofu_Qwen2.5-3B-Instruct_full_v2
