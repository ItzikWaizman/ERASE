# @package _global_
# Finetune Qwen2.5-3B-Instruct on TOFU retain90 split to produce the
# retain oracle for Qwen evaluation (privacy alignment reference).

defaults:
  - override /model: Qwen2.5-3B-Instruct
  - override /trainer: finetune
  - override /data/datasets@data.train: TOFU_QA_retain
  - override /eval: tofu_paper

mode: finetune
model:
  model_args:
    attn_implementation: "eager"
trainer:
  args:
    learning_rate: 1e-5
    weight_decay: 0.01
    warmup_epochs: 1.0
    num_train_epochs: 10
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 2

forget_split: forget10
holdout_split: holdout10
retain_logs_path: null

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

task_name: tofu_Qwen2.5-3B-Instruct_retain90
