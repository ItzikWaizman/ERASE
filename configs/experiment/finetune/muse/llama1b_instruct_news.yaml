# @package _global_
# MUSE-News finetune at 1B using the INSTRUCT base (unsloth/Llama-3.2-1B-Instruct).
# The base (non-instruct) 1B memorized the forget text well (verbmem 0.68,
# exact_mem 0.96) but hit a QA ceiling on knowmem (~0.2, even for the fully
# memorized target), because knowmem is a few-shot QA task. We try the Instruct
# base + its chat template (see configs/model/Llama-3.2-1B-Instruct-local.yaml)
# to lift knowmem. Same lr5e-5/25ep recipe as the base run for a controlled
# comparison; only the starting weights (and the knowmem prompt format) change.
#
# Separate save dirs so the base-1B models are preserved for comparison:
#   data_sub_set=full   -> saves/finetune/muse_news_1b_instruct_full    (TARGET)
#   data_sub_set=retain -> saves/finetune/muse_news_1b_instruct_retain  (RETRAIN)

defaults:
  - override /model: Llama-3.2-1B-Instruct-local
  - override /trainer: finetune
  - override /data/datasets@data.train: MUSE_train
  - override /eval: muse
  - override /data: finetune

mode: finetune
data_split: News
data_sub_set: full   # full -> target, retain -> retrain

data:
  train:
    MUSE_train:
      args:
        hf_args:
          path: tamarsonha/MUSE-${data_split}-Train
          split: ${data_sub_set}

trainer:
  args:
    learning_rate: 5e-5
    weight_decay: 0.01
    warmup_epochs: 1.0   # custom param -> warmup_steps (see src/trainer/__init__.py)
    num_train_epochs: 25
    # --- 16 GB-safe; effective batch = 2 * 16 = 32 (MUSE recipe is 8 * 4) ---
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 16
    gradient_checkpointing: true
    optim: paged_adamw_32bit  # pages 32-bit Adam state to CPU (needs bitsandbytes)
    bf16: true
    bf16_full_eval: true
    # Save the checkpoint, skip inline eval (done as a separate step for PrivLeak).
    do_train: true
    do_eval: false
    eval_on_start: false
    eval_strategy: "no"
    save_strategy: "no"
    save_only_model: true
    report_to: "none"
    logging_steps: 5
    seed: 0

task_name: muse_news_1b_instruct_${data_sub_set}
