# @package _global_
# ERASE on TOFU - Phi-3.5-mini-instruct v2 finetuned checkpoint. Requires
# precomputed covariances under saves/precompute/phi35/wikipedia_covariance/
# (produced by configs/runs/A8_phi35_erase_precompute).
#
# Mirrors configs/experiment/unlearn/tofu/qwen3b/erase.yaml - only the model
# pointer, retain-logs path, and covariance directory differ.

defaults:
  - override /model: Phi-3.5-mini-instruct
  - override /trainer: ERASE
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu_paper

model:
  model_args:
    pretrained_model_name_or_path: "saves/finetune/tofu_Phi-3.5-mini-instruct_full_v2"
    attn_implementation: "eager"

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
retain_logs_path: "saves/eval/phi35/retain_oracle_v2/TOFU_EVAL.json"
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  args:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 2
    num_train_epochs: 10
    learning_rate: 1e-3
    bf16: true
    fp16: false
    gradient_checkpointing: false
    save_strategy: "no"
    warmup_epochs: 0.0
    weight_decay: 0.0
  method_args:
    covariance_dir: "saves/precompute/phi35/wikipedia_covariance"
    target_layers: [1, 2, 3, 4, 5]
    alpha: 1.0
    topk_vjp_count: 0

task_name: ???
