# @package _global_
# Default TOFU unlearning experiment for Qwen2.5-3B-Instruct, targeting the
# v2 init_finetuned model (saves/finetune/tofu_Qwen2.5-3B-Instruct_full_v2).
# Used as the base config for all Qwen3B baseline sweeps (SimNPO, NPO,
# UNDIAL, GradDiff, GradAscent, AltPO, ERASE).

defaults:
  - override /model: qwen2.5-3B-tofu
  - override /trainer: GradAscent
  - override /data: unlearn
  - override /data/datasets@data.forget: TOFU_QA_forget
  - override /data/datasets@data.retain: TOFU_QA_retain
  - override /eval: tofu_paper

model:
  model_args:
    pretrained_model_name_or_path: saves/finetune/tofu_Qwen2.5-3B-Instruct_full_v2
    attn_implementation: "eager"

forget_split: forget10
retain_split: retain90
holdout_split: holdout10
retain_logs_path: null
question_key: "question"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    question_key: ${question_key}

data:
  anchor: forget
  forget:
    TOFU_QA_forget:
      args:
        hf_args:
          name: ${forget_split}
  retain:
    TOFU_QA_retain:
      args:
        hf_args:
          name: ${retain_split}

trainer:
  args:
    warmup_epochs: 1.0
    learning_rate: 1e-5
    weight_decay: 0.01
    num_train_epochs: 10

task_name: ???
