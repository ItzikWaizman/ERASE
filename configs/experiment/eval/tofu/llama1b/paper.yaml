# @package _global_
# Paper-grade TOFU evaluation for Llama-3.2-1B.
# Identical to default.yaml except it overrides /eval to tofu_paper, which
# enables every metric needed for the OpenUnlearning paper's Table 3
# aggregates (Mem./Priv./Util./Agg.). See configs/eval/tofu_paper.yaml.

defaults:
  - override /model: llama-3.2-1B-tofu
  - override /eval: tofu_paper

forget_split: forget10
holdout_split: holdout10
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: "open-unlearning/tofu_Llama-3.2-1B-Instruct_full"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    # overwrite=false so the eval pipeline reuses already-computed metrics
    # in TOFU_EVAL.json. Only newly-added metrics (e.g. forget_Truth_Ratio_paper
    # introduced after the first batch) get re-computed; existing MIAs,
    # gibberish, EM, etc. are read from cache. This makes "rerun" cheap.
    overwrite: false

task_name: ???
