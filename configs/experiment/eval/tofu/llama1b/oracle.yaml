# @package _global_
# Retain-only oracle: open-unlearning/tofu_Llama-3.2-1B-Instruct_retain90.
# Produces saves/eval/tofu_llama-1b_oracle_retain90/TOFU_EVAL.json (and TOFU_SUMMARY.json)
# for retain_logs_path in unlearning / ERASE configs.

defaults:
  - override /model: llama-3.2-1B-tofu
  - override /eval: tofu

forget_split: forget10
holdout_split: holdout10
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: "open-unlearning/tofu_Llama-3.2-1B-Instruct_retain90"

eval:
  tofu:
    forget_split: ${forget_split}
    holdout_split: ${holdout_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true

task_name: tofu_llama-1b_oracle_retain90
