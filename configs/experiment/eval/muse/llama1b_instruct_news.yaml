# @package _global_
# Evaluate a finetuned 1B INSTRUCT MUSE-News model (target or retrain) with the
# full metric suite, using the Instruct chat template so the knowmem QA eval
# gets the instruction format (configs/model/Llama-3.2-1B-Instruct-local.yaml).
# Mirror of eval/muse/llama1b_news.yaml; only the model (weights + chat template)
# changes. Run via eval.yaml:
#
#   # retrain (reference)
#   python src/eval.py experiment=eval/muse/llama1b_instruct_news \
#     model.model_args.pretrained_model_name_or_path=saves/finetune/muse_news_1b_instruct_retain \
#     task_name=muse_news_1b_instruct_retain_eval
#
#   # target (references the retrain eval logs -> PrivLeak)
#   python src/eval.py experiment=eval/muse/llama1b_instruct_news \
#     model.model_args.pretrained_model_name_or_path=saves/finetune/muse_news_1b_instruct_full \
#     retain_logs_path=saves/eval/muse_news_1b_instruct_retain_eval/MUSE_EVAL.json \
#     task_name=muse_news_1b_instruct_full_eval

defaults:
  - override /model: Llama-3.2-1B-Instruct-local
  - override /eval: muse_full

mode: eval
data_split: News
retain_logs_path: null

model:
  model_args:
    pretrained_model_name_or_path: ???  # set on CLI to the finetuned save dir
    device_map: cuda

eval:
  muse:
    data_split: ${data_split}
    retain_logs_path: ${retain_logs_path}
    overwrite: true
    # 16 GB-safe batch sizes: Llama-3.2's 128k vocab makes the logits tensor
    # huge (batch x seqlen x 128256), so the full-sequence logprob/MIA metrics
    # OOM at the upstream defaults (8). Generation metrics are lighter.
    metrics:
      forget_knowmem_ROUGE: {batch_size: 4}
      retain_knowmem_ROUGE: {batch_size: 4}
      forget_verbmem_ROUGE: {batch_size: 4}
      extraction_strength: {batch_size: 2}
      exact_memorization: {batch_size: 2}
      mia_loss: {batch_size: 2}
      mia_min_k: {batch_size: 2}
      mia_min_k_plus_plus: {batch_size: 2}
      mia_zlib: {batch_size: 2}
      privleak:
        pre_compute:
          mia_min_k: {batch_size: 2}

task_name: ???
