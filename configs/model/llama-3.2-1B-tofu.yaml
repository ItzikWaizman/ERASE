# Llama-3.2-1B-Instruct fine-tuned on full TOFU (target model before unlearning).
# Matches open-unlearning/configs/model/llama-3.2-1B-tofu.yaml for eval parity.
model_args:
  pretrained_model_name_or_path: "open-unlearning/tofu_Llama-3.2-1B-Instruct_full"
  torch_dtype: bfloat16
  attn_implementation: "eager"
tokenizer_args:
  pretrained_model_name_or_path: "open-unlearning/tofu_Llama-3.2-1B-Instruct_full"
template_args:
  apply_chat_template: True
  system_prompt: "You are a helpful assistant."
  user_start_tag: "<|start_header_id|>user<|end_header_id|>\n\n"
  user_end_tag: "<|eot_id|>"
  asst_start_tag: "<|start_header_id|>assistant<|end_header_id|>\n\n"
  asst_end_tag: "<|eot_id|>"
