# Instruct Llama-3.2-1B for the 1B MUSE-News experiment, ungated mirror so the
# local machine needs no HF auth. We try the Instruct base (vs configs/model/
# Llama-3.2-1B.yaml) because the base 1B hit a QA ceiling on MUSE knowmem
# (~0.2 even when the forget text was fully memorized): knowmem is a few-shot
# QA task, so an instruction-tuned base + its chat template should answer better.
#
# NOTE: MUSE finetune is raw-text continuation (PretrainingDataset on `text`),
# which ignores template_args; among the eval metrics ONLY knowmem (QADataset)
# uses the chat template, so this swap targets exactly the QA metric. verbmem /
# extraction / exact_memorization / MIA are raw completion and template-agnostic.
model_args:
  pretrained_model_name_or_path: "unsloth/Llama-3.2-1B-Instruct"
  attn_implementation: "eager"
  torch_dtype: bfloat16
tokenizer_args:
  pretrained_model_name_or_path: "unsloth/Llama-3.2-1B-Instruct"
template_args:
  apply_chat_template: True
  system_prompt: "You are a helpful assistant."
  system_prompt_with_special_tokens: "<|begin_of_text|><|start_header_id|>system<|end_header_id|>\n\nYou are a helpful assistant.<|eot_id|>"
  user_start_tag: "<|start_header_id|>user<|end_header_id|>\n\n"
  user_end_tag: "<|eot_id|>"
  asst_start_tag: "<|start_header_id|>assistant<|end_header_id|>\n\n"
  asst_end_tag: "<|eot_id|>"
  date_string: "10 Apr 2025"
